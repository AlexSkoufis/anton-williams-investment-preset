    <script>
      // Intro elements start hidden only when JS runs and motion is allowed.
      // The opening timeline removes the class; this failsafe guarantees it.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('intro-pending');
          setTimeout(function () { d.classList.remove('intro-pending'); }, 3200);
        }
      })();
    </script>
